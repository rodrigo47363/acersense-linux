<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Chassis (Stealth Armor Octagon) -->
    <radialGradient id="chassisGrad" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#181d28"/>
      <stop offset="60%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#06080b"/>
    </radialGradient>

    <!-- Side Facet Armor Gradients -->
    <linearGradient id="plateLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e28"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="plateRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181e28"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <!-- Nitro Neo-Tokyo Red (Infused with #FF007C Tokyo Neon & #FF1436 Nitro Crimson) -->
    <linearGradient id="nitroNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E6A"/>
      <stop offset="25%" stop-color="#FF1136"/>
      <stop offset="65%" stop-color="#D60021"/>
      <stop offset="100%" stop-color="#8A0012"/>
    </linearGradient>

    <!-- 3D Bevel Facet Shading Overlay -->
    <linearGradient id="facetBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Electric Cyan Cooling Flow (AeroBlade Inlets) -->
    <linearGradient id="cyanFlow" x1="180" y1="0" x2="332" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>

    <!-- Crimson Turbo Exhaust -->
    <linearGradient id="crimsonFlow" x1="180" y1="0" x2="332" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1136"/>
      <stop offset="50%" stop-color="#FF1E6A"/>
      <stop offset="100%" stop-color="#D60021"/>
    </linearGradient>

    <!-- High-Impact Drop Shadow -->
    <filter id="badgeShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- 3D Ambient Occlusion Shadow for the Emblem -->
    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF1136" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Base Gaming Chassis (Stealth Armor Octagon) -->
  <g filter="url(#badgeShadow)">
    <!-- Outer Shield Rim -->
    <polygon points="160,24 352,24 480,136 480,376 352,488 160,488 32,376 32,136" fill="url(#chassisGrad)" stroke="#26303d" stroke-width="4" stroke-linejoin="round"/>

    <!-- Armor Facet Plates -->
    <polygon points="32,136 102,174 102,338 32,376" fill="url(#plateLeft)" stroke="#191f28" stroke-width="2"/>
    <polygon points="480,136 410,174 410,338 480,376" fill="url(#plateRight)" stroke="#191f28" stroke-width="2"/>
    <polygon points="160,24 352,24 324,64 188,64" fill="#0d1016" stroke="#191f28" stroke-width="2"/>
    <polygon points="160,488 352,488 324,448 188,448" fill="#07090d" stroke="#191f28" stroke-width="2"/>

    <!-- Inner Armor Border -->
    <polygon points="172,74 340,74 406,166 406,346 340,438 172,438 106,346 106,166" fill="none" stroke="#1c222c" stroke-width="3" stroke-linejoin="round"/>

    <!-- Subtle Turbine Telemetry Ring -->
    <circle cx="256" cy="256" r="152" fill="none" stroke="#1c232e" stroke-width="2" stroke-dasharray="24 16" opacity="0.6"/>
    <circle cx="256" cy="256" r="88" fill="none" stroke="#1c232e" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.4"/>

    <!-- Electric Cyan AeroBlade Cooling Inlets -->
    <line x1="196" y1="76" x2="316" y2="76" stroke="url(#cyanFlow)" stroke-width="6" stroke-linecap="round"/>
    <line x1="224" y1="88" x2="288" y2="88" stroke="url(#cyanFlow)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Crimson Turbo Exhaust Outlets -->
    <line x1="196" y1="436" x2="316" y2="436" stroke="url(#crimsonFlow)" stroke-width="6" stroke-linecap="round"/>
    <line x1="224" y1="424" x2="288" y2="424" stroke="url(#crimsonFlow)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- 2. Master Rotational-Symmetric 3D Chiseled N Emblem -->
  <g filter="url(#emblemShadow)">
    <!-- Solid Base Silhouette with Rich Nitro Neon Gradient -->
    <polygon points="
      116,176 176,116 236,116 
      316,276 316,176 376,116 396,136 
      396,336 336,396 276,396 
      196,236 196,336 136,396 116,376
    " fill="url(#nitroNeon)"/>

    <!-- 3D Bevel Facet Shading Overlay -->
    <polygon points="
      116,176 176,116 236,116 
      316,276 316,176 376,116 396,136 
      396,336 336,396 276,396 
      196,236 196,336 136,396 116,376
    " fill="url(#facetBevel)"/>

    <!-- Razor-Sharp Specular Bevel Highlights -->
    <!-- Top Chamfer & Flat Apex (Left) -->
    <line x1="116" y1="176" x2="176" y2="116" stroke="#FFF4F7" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="176" y1="116" x2="236" y2="116" stroke="#FFF4F7" stroke-width="3"/>

    <!-- Diagonal Master Ridge -->
    <line x1="236" y1="116" x2="316" y2="276" stroke="#FFF4F7" stroke-width="3" stroke-linecap="round"/>

    <!-- Top-Right Wingtip Apex -->
    <line x1="316" y1="176" x2="376" y2="116" stroke="#FFF4F7" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="376" y1="116" x2="396" y2="136" stroke="#FFB3C4" stroke-width="2.5"/>

    <!-- Outer Light Rim (Left) -->
    <line x1="116" y1="176" x2="116" y2="376" stroke="#FF7D97" stroke-width="2.5"/>

    <!-- Bottom Deep Shadow Creases (180° Rotational Symmetry) -->
    <line x1="396" y1="336" x2="336" y2="396" stroke="#260005" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="336" y1="396" x2="276" y2="396" stroke="#260005" stroke-width="3"/>
    <line x1="276" y1="396" x2="196" y2="236" stroke="#260005" stroke-width="3" stroke-linecap="round"/>
    <line x1="196" y1="336" x2="136" y2="396" stroke="#260005" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="396" y1="136" x2="396" y2="336" stroke="#380008" stroke-width="2.5"/>
  </g>
</svg>