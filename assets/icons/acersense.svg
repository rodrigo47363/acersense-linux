<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#30363D" stroke-width="12" />

  <!-- Outer Turbine Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#21262D" stroke-width="20" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-dasharray="180 60 90 40" stroke-linecap="round" />

  <!-- Center Hub -->
  <circle cx="256" cy="256" r="64" fill="#0D1117" stroke="url(#accentGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="28" fill="#58A6FF" filter="url(#glow)" />

  <!-- AeroBlade Fan Blades (Symmetric Aerodynamic Curves) -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round">
    <path d="M 256 192 C 270 120 330 100 370 100" />
    <path d="M 320 256 C 392 270 412 330 412 370" />
    <path d="M 256 320 C 242 392 182 412 142 412" />
    <path d="M 192 256 C 120 242 100 182 100 142" />
  </g>

  <!-- Speed Pulse Accents -->
  <circle cx="370" cy="100" r="10" fill="#58A6FF" />
  <circle cx="412" cy="370" r="10" fill="#58A6FF" />
  <circle cx="142" cy="412" r="10" fill="#58A6FF" />
  <circle cx="100" cy="142" r="10" fill="#58A6FF" />
</svg>
