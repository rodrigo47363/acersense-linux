; ==============================================================================
; AcerSense Polybar Module Configuration
; Include this in your Polybar config.ini or user module imports:
;   modules-right = cpu memory acersense date
; ==============================================================================

[module/acersense]
type = custom/script
exec = acersense status --polybar
interval = 2
format-prefix = "󰚥 "
format-prefix-foreground = #58A6FF
format-background = #161B22
format-foreground = #E6EDF3
format-padding = 1
format-underline = #58A6FF

; Left click opens Native Qt GUI Control Center
click-left = acersense-gui &

; Right click toggles Turbo / Extreme cooling mode
click-right = acersense profile --set turbo

; Middle click resets to Balanced mode
click-middle = acersense profile --set balanced
