name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  check-and-test:
    name: Build, Lint & QA Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Static Analysis & Security Lints (cargo clippy)
        run: cargo clippy --bins --tests -- -D warnings

      - name: Run Unit & QA Test Suite (cargo test)
        run: cargo test --all-targets --verbose

      - name: Build Optimized Release Binaries
        run: cargo build --release --bins
