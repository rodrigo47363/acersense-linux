[package]
name = "acersense"
version = "2.0.0"
edition = "2021"
authors = ["Rodrigo <rodrigo@parrot-sec.local>"]
description = "Ultra-fast low-level hardware control suite for Acer Nitro & Predator in Linux"
license = "GPL-3.0"

[[bin]]
name = "acersense"
path = "src/main.rs"

[[bin]]
name = "acersense-gui"
path = "src/gui_main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"
glob = "0.3"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
